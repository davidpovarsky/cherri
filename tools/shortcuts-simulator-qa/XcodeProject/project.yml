name: CherriSimulatorQA
options:
  bundleIdPrefix: org.cherrilang.qa
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
targets:
  CherriSimulatorQAReceiver:
    type: application
    platform: iOS
    sources:
      - path: ReceiverApp
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.cherrilang.qa.Receiver
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: ReceiverApp/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
  CherriSimulatorQAUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: CherriSimulatorQAReceiver
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.cherrilang.qa.UITests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: CherriSimulatorQAReceiver
        TARGETED_DEVICE_FAMILY: "1,2"

name: ImportHelper
options:
  bundleIdPrefix: org.cherrilang.poc
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "NO"
targets:
  ImportHelper:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.cherrilang.poc.ImportHelper
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGN_IDENTITY: "-"
  ImportHelperUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: ImportHelper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.cherrilang.poc.ImportHelperUITests
        TEST_TARGET_NAME: ImportHelper
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGN_IDENTITY: "-"
schemes:
  ImportHelper:
    build:
      targets:
        ImportHelper: all
        ImportHelperUITests: [test]
    test:
      targets:
        - ImportHelperUITests

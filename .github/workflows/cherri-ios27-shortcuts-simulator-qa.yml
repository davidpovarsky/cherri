name: Cherri iOS/iPadOS 27 Shortcuts Simulator QA

on:
  push:
    branches:
      - "agent/cherri-p10r13-*"
      - "agent/cherri-p10r14-*"
    paths:
      - ".github/workflows/cherri-ios27-shortcuts-simulator-qa.yml"
      - "scripts/ios27_shortcuts_simulator_qa.sh"
      - "tools/shortcuts-simulator-qa/**"
      - "signing.go"
      - "language_cli_adapter.go"
      - "debug_stdlib.go"
      - "simulator_qa_oracle.go"
      - "p14_simulator_qa_runtime_trace_test.go"
  workflow_dispatch:
    inputs:
      probe_level:
        description: "Probe level (preflight | import | editor | runtime | full)"
        required: false
        default: "full"
        type: choice
        options:
          - preflight
          - import
          - editor
          - runtime
          - full
      device_profile:
        description: "Simulator device profile (ipad-default | iphone-fallback)"
        required: false
        default: "ipad-default"
        type: choice
        options:
          - ipad-default
          - iphone-fallback
      sample_id:
        description: "Synthetic fixture sample ID"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - qa-functional
          - qa-scroll-editor
          - qa-rtl-hebrew
      capture_full_editor:
        description: "Capture multi-page editor screenshots and accessibility tree"
        required: false
        default: true
        type: boolean
      max_editor_pages:
        description: "Maximum editor pages to scroll and snapshot (1..20)"
        required: false
        default: "20"
        type: string
      require_runtime:
        description: "Fail closed with non-zero exit if SHORTCUT_RUN_COMPLETED or TRACE_CAPTURED is not PASS"
        required: false
        default: false
        type: boolean
      upload_sanitized_artifacts:
        description: "Upload sanitized QA artifacts (7-day retention)"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator-qa:
    name: iPadOS 27 Simulator Shortcuts QA
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go Simulator QA & Trace Oracle Unit Tests
        run: go test -v -run "TestP14_|TestP10_A1_|TestP13_SimulatorQA|TestDebug" .

      - name: Run iPadOS 27 Simulator Shortcuts QA Orchestrator
        env:
          CHERRI_SIGNING_SERVER: ${{ secrets.CHERRI_SIGNING_SERVER }}
        run: |
          chmod +x scripts/ios27_shortcuts_simulator_qa.sh
          ./scripts/ios27_shortcuts_simulator_qa.sh \
            "${{ inputs.probe_level || 'full' }}" \
            "${{ inputs.device_profile || 'ipad-default' }}" \
            "${{ inputs.sample_id || 'all' }}" \
            "${{ inputs.capture_full_editor || 'true' }}" \
            "${{ inputs.max_editor_pages || '20' }}" \
            "${{ inputs.require_runtime || 'false' }}"

      - name: Pre-Upload Sanitization & Privacy Gate (Text + Binary PNG Scan)
        id: privacy_gate
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, re, sys
          root = "artifacts/cherri-ios27-simulator-qa"
          if not os.path.isdir(root):
              sys.exit(1)
          forbidden = re.compile(rb"(?i)(cherri-shortcut-audit-20261110|\b[0-3][0-9]\.plist\b|BEGIN [A-Z ]*PRIVATE KEY|ghp_[A-Za-z0-9_]+|github_pat_[A-Za-z0-9_]+|sk-[A-Za-z0-9]{16,}|AppleID|iCloudToken)")
          summary_checked = False
          for dirpath, _, filenames in os.walk(root):
              for fn in filenames:
                  p = os.path.join(dirpath, fn)
                  if fn.endswith((".shortcut", ".plist", ".cherri")):
                      print(f"PRIVACY GATE FAILED: raw build artifact {p} must not remain in upload directory", file=sys.stderr)
                      sys.exit(1)
                  with open(p, "rb") as f:
                      data = f.read()
                  m = forbidden.search(data)
                  if m:
                      print(f"PRIVACY GATE FAILED: forbidden pattern {m.group(0)!r} in {p}", file=sys.stderr)
                      sys.exit(1)
                  if fn == "summary.json":
                      doc = json.loads(data.decode("utf-8"))
                      if not doc.get("privacyGatePassed"):
                          print(f"PRIVACY GATE FAILED: summary.json privacyGatePassed is false in {p}", file=sys.stderr)
                          sys.exit(1)
                      summary_checked = True
          if not summary_checked:
              print("PRIVACY GATE FAILED: summary.json not found", file=sys.stderr)
              sys.exit(1)
          gh_out = os.environ.get("GITHUB_OUTPUT")
          if gh_out:
              with open(gh_out, "a", encoding="utf-8") as out_f:
                  out_f.write("passed=true\n")
          print("Privacy & sanitization gate passed across all text and binary artifacts.")
          PY

      - name: Upload Sanitized Simulator QA Artifacts
        if: always() && steps.privacy_gate.outputs.passed == 'true' && (inputs.upload_sanitized_artifacts == true || inputs.upload_sanitized_artifacts == '')
        uses: actions/upload-artifact@v4
        with:
          name: cherri-ios27-simulator-qa-${{ github.run_id }}
          path: artifacts/cherri-ios27-simulator-qa/${{ github.run_id }}/
          retention-days: 7
          if-no-files-found: warn

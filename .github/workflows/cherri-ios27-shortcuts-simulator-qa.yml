name: Cherri iOS/iPadOS 27 Shortcuts Simulator QA

on:
  push:
    branches:
      - "agent/cherri-p10r13-*"
      - "agent/cherri-p10r14-*"
    paths:
      - ".github/workflows/cherri-ios27-shortcuts-simulator-qa.yml"
      - "scripts/ios27_shortcuts_simulator_qa.sh"
      - "tools/shortcuts-simulator-qa/**"
      - "signing.go"
      - "language_cli_adapter.go"
      - "debug_stdlib.go"
      - "simulator_qa_oracle.go"
      - "p14_simulator_qa_runtime_trace_test.go"
  workflow_dispatch:
    inputs:
      probe_level:
        description: "Probe level (preflight | import | editor | runtime | full)"
        required: false
        default: "full"
        type: choice
        options:
          - preflight
          - import
          - editor
          - runtime
          - full
      device_profile:
        description: "Simulator device profile (ipad-default | iphone-fallback)"
        required: false
        default: "ipad-default"
        type: choice
        options:
          - ipad-default
          - iphone-fallback
      sample_id:
        description: "Synthetic fixture sample ID"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - qa-functional
          - qa-functional-legacy
          - qa-bool-list
          - qa-short-circuit
          - qa-scroll-editor
          - qa-rtl-hebrew
      capture_full_editor:
        description: "Capture multi-page editor screenshots and accessibility tree"
        required: false
        default: true
        type: boolean
      max_editor_pages:
        description: "Maximum editor pages to scroll and snapshot (1..20)"
        required: false
        default: "20"
        type: string
      require_runtime:
        description: "Fail closed with non-zero exit if SHORTCUT_RUN_COMPLETED or TRACE_CAPTURED is not PASS"
        required: false
        default: false
        type: boolean
      upload_sanitized_artifacts:
        description: "Upload sanitized QA artifacts (7-day retention)"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.sample_id || 'all' }}
  cancel-in-progress: true

jobs:
  simulator-qa:
    name: iPadOS 27 Simulator Shortcuts QA
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go Simulator QA & Trace Oracle Unit Tests
        run: go test -v -run "TestP14_|TestP10_A1_|TestP13_SimulatorQA|TestDebug" .

      - name: Test AX Inspector and publication quarantine
        run: python3 -m unittest discover -s tools/shortcuts-simulator-qa -p 'test_*.py' -v

      - name: Run iPadOS 27 Simulator Shortcuts QA Orchestrator
        env:
          CHERRI_SIGNING_SERVER: ${{ secrets.CHERRI_SIGNING_SERVER }}
        run: |
          chmod +x scripts/ios27_shortcuts_simulator_qa.sh
          ./scripts/ios27_shortcuts_simulator_qa.sh \
            "${{ inputs.probe_level || 'full' }}" \
            "${{ inputs.device_profile || 'ipad-default' }}" \
            "${{ inputs.sample_id || 'all' }}" \
            "${{ inputs.capture_full_editor || 'true' }}" \
            "${{ inputs.max_editor_pages || '20' }}" \
            "${{ inputs.require_runtime || 'false' }}"

      - name: Stage synthetic text artifacts; quarantine raster and raw inputs
        id: privacy_gate
        if: always()
        run: |
          python3 tools/shortcuts-simulator-qa/prepare_public_artifacts.py \
            --root "artifacts/cherri-ios27-simulator-qa/${{ github.run_id }}" \
            --output "artifacts/cherri-ios27-simulator-qa-public/${{ github.run_id }}" \
            --fixtures-dir tools/shortcuts-simulator-qa/fixtures

      - name: Upload Sanitized Simulator QA Artifacts
        if: always() && steps.privacy_gate.outputs.passed == 'true' && (inputs.upload_sanitized_artifacts == true || inputs.upload_sanitized_artifacts == '')
        uses: actions/upload-artifact@v4
        with:
          name: cherri-ios27-simulator-qa-${{ github.run_id }}
          path: artifacts/cherri-ios27-simulator-qa-public/${{ github.run_id }}/
          retention-days: 7
          if-no-files-found: warn

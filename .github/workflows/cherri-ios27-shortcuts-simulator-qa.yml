name: Cherri iOS/iPadOS 27 Shortcuts Simulator QA

# Diagnostic branch only. This file does not replace the normal QA workflow
# on the integration branch and cannot provide simulator or native acceptance.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cherri-project-prerequisite-observation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  project-prerequisite-observation:
    name: Observe the original Xcode project prerequisite
    runs-on: xcode-27
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact diagnostic source
        uses: actions/checkout@v4

      - name: Verify unchanged prerequisite and diagnostic controls
        timeout-minutes: 5
        shell: bash
        run: |
          python3 -B -m unittest discover -s tools/shortcuts-simulator-qa -p 'test_project_prerequisite.py' -v
          python3 -B -m unittest discover -s tools/shortcuts-simulator-qa -p 'test_project_prerequisite_observation.py' -v

      - name: Capture only the original project prerequisite
        id: prerequisite_observation
        timeout-minutes: 6
        shell: bash
        run: |
          python3 -B tools/shortcuts-simulator-qa/project_prerequisite_observation.py \
            --repo "$GITHUB_WORKSPACE" \
            --root "$RUNNER_TEMP/cherri-project-prerequisite-${{ github.run_id }}-${{ github.run_attempt }}" \
            --source-sha "${{ github.sha }}" \
            --run-id "${{ github.run_id }}" \
            --attempt "${{ github.run_attempt }}" \
            --bash "$BASH" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload only sealed prerequisite diagnostics
        if: always() && steps.prerequisite_observation.outputs.publication_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cherri-project-prerequisite-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cherri-project-prerequisite-${{ github.run_id }}-${{ github.run_attempt }}/public/project-prerequisite.zip.p7m
            ${{ runner.temp }}/cherri-project-prerequisite-${{ github.run_id }}-${{ github.run_attempt }}/public/summary.json
          retention-days: 3
          if-no-files-found: error

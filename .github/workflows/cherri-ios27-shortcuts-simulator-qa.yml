name: Cherri Xcode 27 read-only inventory

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cherri-xcode27-inventory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    name: Read-only Xcode and CoreSimulator inventory
    runs-on: xcode-27
    timeout-minutes: 5
    steps:
      - name: Checkout exact diagnostic source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: true

      - name: Capture bounded inventory and encrypt originals
        run: |
          python3 tools/shortcuts-simulator-qa/xcode_environment_inventory.py \
            --output "$RUNNER_TEMP/cherri-xcode27-inventory-${{ github.run_id }}" \
            --source-sha "${{ github.sha }}" \
            --run-id "${{ github.run_id }}"

      - name: Upload ciphertext and allowlisted summary only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cherri-xcode27-readonly-inventory-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/cherri-xcode27-inventory-${{ github.run_id }}/public/inventory.zip.p7m
            ${{ runner.temp }}/cherri-xcode27-inventory-${{ github.run_id }}/public/summary.json
          retention-days: 3
          if-no-files-found: warn

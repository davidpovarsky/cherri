name: Shared Parser Diagnostic Qualification

"on": create

permissions:
  contents: read

concurrency:
  group: parser-diagnostic-ec3281-${{ github.ref }}
  cancel-in-progress: false

jobs:
  actual-diagnostic-routes:
    if: >-
      github.repository == 'davidpovarsky/cherri' &&
      github.event_name == 'create' &&
      github.event.ref_type == 'branch' &&
      github.event.ref == 'probe/cherri-p10r15-parser-diagnostics-20261126' &&
      github.run_attempt == '1'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - name: Check out the exact controller
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: controller
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the fixed compiler source
        uses: actions/checkout@v6
        with:
          ref: ec3281b02c9911f6175c9220d0380443b27a7afd
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Select the existing qualified Go version
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.13'
          cache-dependency-path: source/go.sum

      - name: Execute affected packages and actual compiler routes
        timeout-minutes: 21
        run: /usr/bin/python3 -I -B controller/tools/ci/parser_diagnostics/run.py

      - name: Retain original component evidence and public binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parser-diagnostics-ec3281-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cherri-parser-diagnostic-ec3281
          if-no-files-found: error
          retention-days: 30

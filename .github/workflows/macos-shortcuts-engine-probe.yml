name: macOS Shortcuts engine probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/macos-shortcuts-engine-probe.yml'
      - 'tools/shortcut-runtime/**'

permissions:
  actions: read
  contents: read

concurrency:
  group: macos-shortcuts-engine-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Checkout
        uses: actions/checkout@v6

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Probe Shortcuts engine surfaces
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p probe
          python3 tools/shortcut-runtime/runtime_probe.py --out-dir probe

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Upload probe results
        uses: actions/upload-artifact@v4
        with:
          name: macos-shortcuts-engine-probe-${{ matrix.os }}
          path: probe/
          if-no-files-found: error
          retention-days: 14

name: P10R15 Fixed Valueblock Component Evidence

on:
  push:
    branches:
      - audit/cherri-p10r15-valueblock-ci-20261122
    paths:
      - .github/workflows/p10r15-valueblock-component.yml
      - tools/p10r15/run_valueblock_component_ci.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p10r15-valueblock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fixed-valueblock:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      GIT_NO_REPLACE_OBJECTS: "1"
      CHERRI_COMPONENT_SOURCE: ${{ github.workspace }}/subject
      CHERRI_COMPONENT_OUT: ${{ github.workspace }}/cherri-valueblock-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout exact workflow implementation
        uses: actions/checkout@v6
        with:
          path: harness
          persist-credentials: false

      - name: Checkout exact reviewed value-block source
        uses: actions/checkout@v6
        with:
          ref: ed4f8985b5088ae13155e737c1d3eca632f17b34
          path: subject
          fetch-depth: 0
          persist-credentials: false

      - name: Preserve declared source origin
        run: git -C "$CHERRI_COMPONENT_SOURCE" remote set-url origin https://github.com/davidpovarsky/cherri.git

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
          cache-dependency-path: subject/go.sum

      - name: Execute fixed value-block scenarios with bounded original intake
        timeout-minutes: 10
        run: python3 -B harness/tools/p10r15/run_valueblock_component_ci.py

      - name: Retain actual originals including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p10r15-valueblock-component-${{ github.run_id }}
          path: ${{ env.CHERRI_COMPONENT_OUT }}
          if-no-files-found: warn
          retention-days: 14

# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Build & Test

on:
  push:
    branches: [ "main", "agent/**" ]
  workflow_dispatch:

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: 1.24

    - name: Build
      run: go build -v ./...

    - name: Full Go Test Suite
      run: go test -count=1 -timeout=15m -v ./...

    - name: Full Matrix Regression Tests
      run: go test -count=1 -timeout=15m -v -run '^Test(CORE|CODEC|CTRL|META|LANG|IOS|GEN)' ./...

    - name: Machine-Checked Test Discovery Gate
      run: go run ./tools/ci-test-discovery -run '^Test(CORE|CODEC|CTRL|META|LANG|IOS|GEN)'

    - name: Decompilation Test
      run: go test -run TestDecomp -v ./...

    - name: Package Manager Test
      run: go test -run TestPackages -v ./...

    - name: Differential Legacy Parity Gate
      run: go test -v ./tools/legacy-parity/...

  build-test-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: 1.24

    - name: Build
      run: go build -v ./...

    - name: Full Go Test Suite
      run: go test -count=1 -timeout=15m -v ./...

    - name: Full Matrix Regression Tests
      run: go test -count=1 -timeout=15m -v -run '^Test(CORE|CODEC|CTRL|META|LANG|IOS|GEN)' ./...

    - name: Machine-Checked Test Discovery Gate
      run: go run ./tools/ci-test-discovery -run '^Test(CORE|CODEC|CTRL|META|LANG|IOS|GEN)'

    - name: Decompilation Test
      run: go test -run TestDecomp -v ./...

    - name: Package Manager Test
      run: go test -run TestPackages -v ./...

    - name: Differential Legacy Parity Gate
      run: go test -v ./tools/legacy-parity/...

  build-test-nix:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - uses: DeterminateSystems/nix-installer-action@main
    - uses: DeterminateSystems/magic-nix-cache-action@main

    # Runs tests as part of build
    - name: Build nix package
      run: nix build

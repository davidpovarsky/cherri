# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Build & Test

on:
  push:
    branches: [ "main", "agent/**" ]
  workflow_dispatch:

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Set up Node for encoding gate process controls
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Required Encoding Gate Process Controls
      run: python3 -B -m unittest discover -s tools/shortcut-runtime/tests -p 'test_required_encoding*.py' -v

    - name: AI Evaluation Harness Controls (no external model calls)
      run: python3 -B -m unittest discover -s tools/language-ai-eval -p 'test_*.py' -v

    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: 1.24

    - name: Build
      run: |
        go build -v ./...
        go build -o cherri .

    - name: Full Go Test Suite
      run: python3 -B tools/p10r15/run_full_go_suite.py --report "$RUNNER_TEMP/cherri-full-go-suite.json"

    - name: Upload complete Go suite execution receipt
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cherri-full-go-suite-${{ github.job }}
        path: ${{ runner.temp }}/cherri-full-go-suite.json
        if-no-files-found: warn
        retention-days: 14

    - name: Full Matrix Regression Tests
      run: go test -count=1 -timeout=15m -v -run '^Test(CORE|CODEC|CTRL|META|LANG|IOS|GEN)' ./...

    - name: Machine-Checked Test Discovery Gate
      run: go run ./tools/ci-test-discovery -run '^Test(CORE|CODEC|CTRL|META|LANG|IOS|GEN)'

    - name: Decompilation Test
      run: go test -run TestDecomp -v ./...

    - name: Package Manager Test
      run: go test -run TestPackages -v ./...

    - name: Differential Legacy Parity Gate
      run: |
        go test -v ./tools/legacy-parity/...
        go run ./tools/legacy-parity

    - name: P10R8 Independent Oracle Mutation Suite & Sanitized Report Integrity
      # PRIVATE_CORPUS_NOT_RUN_IN_PUBLIC_CI: the 38 private specimens are never present in CI.
      # The reconcile --verify below is a REPORT-INTEGRITY check of committed sanitized files,
      # not a live corpus recompilation and not a corpus PASS.
      run: |
        python3 -B tools/p10r7/test_independent_oracle_mutations.py -v
        python3 -B tools/p10r7/reconcile_private_and_sanitized_reports.py --verify --mutate-check
        echo "PRIVATE_CORPUS_NOT_RUN_IN_PUBLIC_CI"

    - name: P10 SSoT, Coverage Ledgers, Pack & Release Gates
      run: |
        git fetch origin apple-actions-pack-pure-core-20261022
        go run ./tools/language-schema --verify-generated
        python3 tools/p10r3/verify_or_generate_pack.py --verify-generated
        python3 tools/p10r3/verify_ledger_consistency.py
        python3 tools/p10r3/verify_ledger_consistency.py --mutate-check
        python3 tools/p10r3/verify_consumer_compatibility.py
        python3 tools/p10r3/verify_consumer_compatibility.py --mutate-check
        python3 tools/p10r3/generate_negative_mutation_matrix.py
        python3 tools/p10r3/test_coverage_and_gates.py -v
        python3 tools/p10r3/run_release_gates.py --verify-registry
        python3 tools/p10r3/run_release_gates.py --verify-commit
        python3 tools/p10r3/run_release_gates.py --run-all --out-results /tmp/p10r4-gate-results.json --ci-attestation /tmp/p10r4-ci-attestation.json

    - name: Upload P10R4 Release Gate Attestation (Linux)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: p10r4-release-gates-linux
        path: |
          /tmp/p10r4-gate-results.json
          /tmp/p10r4-ci-attestation.json

  build-test-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Set up Node for encoding gate process controls
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Required Encoding Gate Process Controls
      run: python3 -B -m unittest discover -s tools/shortcut-runtime/tests -p 'test_required_encoding*.py' -v

    - name: AI Evaluation Harness Controls (no external model calls)
      run: python3 -B -m unittest discover -s tools/language-ai-eval -p 'test_*.py' -v

    - name: Mandatory WorkflowKit REQUIRED Encoding Gate
      timeout-minutes: 12
      run: |
        set -euo pipefail
        prelude_repo="$RUNNER_TEMP/required-encoding-shortcutkit"
        git init "$prelude_repo"
        git -C "$prelude_repo" remote add origin https://github.com/frontboat/shortcutkit.git
        git -C "$prelude_repo" fetch --depth=1 origin ee52c32937053268e4a035eba4b372fe77ec6411
        git -C "$prelude_repo" checkout --detach FETCH_HEAD
        test "$(git -C "$prelude_repo" rev-parse HEAD)" = ee52c32937053268e4a035eba4b372fe77ec6411
        python3 -B tools/shortcut-runtime/required_encoding_gate.py \
          --prelude "$prelude_repo/tools/jxa-prelude.js" \
          --output "$RUNNER_TEMP/required-encoding-gate" \
          --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"

    - name: Upload Required Encoding Gate Observations
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: required-encoding-gate
        if-no-files-found: error
        path: |
          ${{ runner.temp }}/required-encoding-gate/*.json
          ${{ runner.temp }}/required-encoding-gate/*.log

    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: 1.24

    - name: Build
      run: |
        go build -v ./...
        go build -o cherri .

    - name: Full Go Test Suite
      env:
        CHERRI_EDITOR_CONTRACT_EVIDENCE_OUTPUT: ${{ runner.temp }}/cherri-editor-contract-evidence
      run: python3 -B tools/p10r15/run_full_go_suite.py --report "$RUNNER_TEMP/cherri-full-go-suite.json"

    - name: Collect bounded public editor execution evidence
      if: always()
      run: |
        python3 -B -m unittest discover -s tools/p10r15 -p 'test_collect_editor_contract_evidence.py' -v
        python3 -B tools/p10r15/collect_editor_contract_evidence.py \
          --root "$RUNNER_TEMP/cherri-editor-contract-evidence" \
          --output "$RUNNER_TEMP/cherri-editor-contract-public-capture" \
          --source "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"

    - name: Upload public editor execution tuples and raw observations
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cherri-editor-contract-macos-${{ github.run_id }}
        path: |
          ${{ runner.temp }}/cherri-editor-contract-public-capture/inventory.json
          ${{ runner.temp }}/cherri-editor-contract-public-capture/public-editor-evidence.zip
        if-no-files-found: warn
        retention-days: 14

    - name: Upload complete Go suite execution receipt
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cherri-full-go-suite-${{ github.job }}
        path: ${{ runner.temp }}/cherri-full-go-suite.json
        if-no-files-found: warn
        retention-days: 14

    - name: Full Matrix Regression Tests
      run: go test -count=1 -timeout=15m -v -run '^Test(CORE|CODEC|CTRL|META|LANG|IOS|GEN)' ./...

    - name: Machine-Checked Test Discovery Gate
      run: go run ./tools/ci-test-discovery -run '^Test(CORE|CODEC|CTRL|META|LANG|IOS|GEN)'

    - name: Decompilation Test
      run: go test -run TestDecomp -v ./...

    - name: Package Manager Test
      run: go test -run TestPackages -v ./...

    - name: Differential Legacy Parity Gate
      run: |
        go test -v ./tools/legacy-parity/...
        go run ./tools/legacy-parity

    - name: P10R8 Independent Oracle Mutation Suite & Sanitized Report Integrity
      # PRIVATE_CORPUS_NOT_RUN_IN_PUBLIC_CI: the 38 private specimens are never present in CI.
      # The reconcile --verify below is a REPORT-INTEGRITY check of committed sanitized files,
      # not a live corpus recompilation and not a corpus PASS.
      run: |
        python3 -B tools/p10r7/test_independent_oracle_mutations.py -v
        python3 -B tools/p10r7/reconcile_private_and_sanitized_reports.py --verify --mutate-check
        echo "PRIVATE_CORPUS_NOT_RUN_IN_PUBLIC_CI"

    - name: P10 SSoT, Coverage Ledgers, Pack & Release Gates
      run: |
        git fetch origin apple-actions-pack-pure-core-20261022
        go run ./tools/language-schema --verify-generated
        python3 tools/p10r3/verify_or_generate_pack.py --verify-generated
        python3 tools/p10r3/verify_ledger_consistency.py
        python3 tools/p10r3/verify_ledger_consistency.py --mutate-check
        python3 tools/p10r3/verify_consumer_compatibility.py
        python3 tools/p10r3/verify_consumer_compatibility.py --mutate-check
        python3 tools/p10r3/generate_negative_mutation_matrix.py
        python3 tools/p10r3/test_coverage_and_gates.py -v
        python3 tools/p10r3/run_release_gates.py --verify-registry
        python3 tools/p10r3/run_release_gates.py --verify-commit
        python3 tools/p10r3/run_release_gates.py --run-all --out-results /tmp/p10r4-gate-results.json --ci-attestation /tmp/p10r4-ci-attestation.json

    - name: Upload P10R4 Release Gate Attestation (macOS)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: p10r4-release-gates-macos
        path: |
          /tmp/p10r4-gate-results.json
          /tmp/p10r4-ci-attestation.json

  build-test-nix:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - uses: DeterminateSystems/nix-installer-action@main
    - uses: DeterminateSystems/magic-nix-cache-action@main

    # Runs tests as part of build
    - name: Build nix package
      run: nix build

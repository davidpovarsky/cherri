# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Build & Test

on:
  push:
    branches: [ "main", "agent/**" ]
  workflow_dispatch:

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: 1.24

    - name: Build
      run: |
        go build -v ./...
        go build -o cherri .

    - name: Full Go Test Suite
      run: go test -count=1 -timeout=15m -v ./...

    - name: Full Matrix Regression Tests
      run: go test -count=1 -timeout=15m -v -run '^Test(CORE|CODEC|CTRL|META|LANG|IOS|GEN)' ./...

    - name: Machine-Checked Test Discovery Gate
      run: go run ./tools/ci-test-discovery -run '^Test(CORE|CODEC|CTRL|META|LANG|IOS|GEN)'

    - name: Decompilation Test
      run: go test -run TestDecomp -v ./...

    - name: Package Manager Test
      run: go test -run TestPackages -v ./...

    - name: Differential Legacy Parity Gate
      run: |
        go test -v ./tools/legacy-parity/...
        go run ./tools/legacy-parity

    - name: P10R8 Independent Oracle Mutation Suite & Sanitized Report Integrity
      # PRIVATE_CORPUS_NOT_RUN_IN_PUBLIC_CI: the 38 private specimens are never present in CI.
      # The reconcile --verify below is a REPORT-INTEGRITY check of committed sanitized files,
      # not a live corpus recompilation and not a corpus PASS.
      run: |
        python3 -B tools/p10r7/test_independent_oracle_mutations.py -v
        python3 -B tools/p10r7/reconcile_private_and_sanitized_reports.py --verify --mutate-check
        echo "PRIVATE_CORPUS_NOT_RUN_IN_PUBLIC_CI"

    - name: P10 SSoT, Coverage Ledgers, Pack & Release Gates
      run: |
        git fetch origin apple-actions-pack-pure-core-20261022
        go run ./tools/language-schema --verify-generated
        python3 tools/p10r3/verify_or_generate_pack.py --verify-generated
        python3 tools/p10r3/verify_ledger_consistency.py
        python3 tools/p10r3/verify_ledger_consistency.py --mutate-check
        python3 tools/p10r3/verify_consumer_compatibility.py
        python3 tools/p10r3/verify_consumer_compatibility.py --mutate-check
        python3 tools/p10r3/generate_negative_mutation_matrix.py
        python3 tools/p10r3/test_coverage_and_gates.py -v
        python3 tools/p10r3/run_release_gates.py --verify-registry
        python3 tools/p10r3/run_release_gates.py --verify-commit
        python3 tools/p10r3/run_release_gates.py --run-all --out-results /tmp/p10r4-gate-results.json --ci-attestation /tmp/p10r4-ci-attestation.json

    - name: Upload P10R4 Release Gate Attestation (Linux)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: p10r4-release-gates-linux
        path: |
          /tmp/p10r4-gate-results.json
          /tmp/p10r4-ci-attestation.json

  build-test-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: 1.24

    - name: Build
      run: |
        go build -v ./...
        go build -o cherri .

    - name: Full Go Test Suite
      run: go test -count=1 -timeout=15m -v ./...

    - name: Full Matrix Regression Tests
      run: go test -count=1 -timeout=15m -v -run '^Test(CORE|CODEC|CTRL|META|LANG|IOS|GEN)' ./...

    - name: Machine-Checked Test Discovery Gate
      run: go run ./tools/ci-test-discovery -run '^Test(CORE|CODEC|CTRL|META|LANG|IOS|GEN)'

    - name: Decompilation Test
      run: go test -run TestDecomp -v ./...

    - name: Package Manager Test
      run: go test -run TestPackages -v ./...

    - name: Differential Legacy Parity Gate
      run: |
        go test -v ./tools/legacy-parity/...
        go run ./tools/legacy-parity

    - name: P10R8 Independent Oracle Mutation Suite & Sanitized Report Integrity
      # PRIVATE_CORPUS_NOT_RUN_IN_PUBLIC_CI: the 38 private specimens are never present in CI.
      # The reconcile --verify below is a REPORT-INTEGRITY check of committed sanitized files,
      # not a live corpus recompilation and not a corpus PASS.
      run: |
        python3 -B tools/p10r7/test_independent_oracle_mutations.py -v
        python3 -B tools/p10r7/reconcile_private_and_sanitized_reports.py --verify --mutate-check
        echo "PRIVATE_CORPUS_NOT_RUN_IN_PUBLIC_CI"

    - name: P10 SSoT, Coverage Ledgers, Pack & Release Gates
      run: |
        git fetch origin apple-actions-pack-pure-core-20261022
        go run ./tools/language-schema --verify-generated
        python3 tools/p10r3/verify_or_generate_pack.py --verify-generated
        python3 tools/p10r3/verify_ledger_consistency.py
        python3 tools/p10r3/verify_ledger_consistency.py --mutate-check
        python3 tools/p10r3/verify_consumer_compatibility.py
        python3 tools/p10r3/verify_consumer_compatibility.py --mutate-check
        python3 tools/p10r3/generate_negative_mutation_matrix.py
        python3 tools/p10r3/test_coverage_and_gates.py -v
        python3 tools/p10r3/run_release_gates.py --verify-registry
        python3 tools/p10r3/run_release_gates.py --verify-commit
        python3 tools/p10r3/run_release_gates.py --run-all --out-results /tmp/p10r4-gate-results.json --ci-attestation /tmp/p10r4-ci-attestation.json

    - name: Upload P10R4 Release Gate Attestation (macOS)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: p10r4-release-gates-macos
        path: |
          /tmp/p10r4-gate-results.json
          /tmp/p10r4-ci-attestation.json

  build-test-nix:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - uses: DeterminateSystems/nix-installer-action@main
    - uses: DeterminateSystems/magic-nix-cache-action@main

    # Runs tests as part of build
    - name: Build nix package
      run: nix build

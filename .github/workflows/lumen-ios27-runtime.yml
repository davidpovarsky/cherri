name: Lumen iOS 27 Runtime Validation
on:
  push:
    branches: [agent/lumen-main-text-fix-20261025]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lumen-ios27:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Install original upstream Cherri
        run: |
          git clone https://github.com/electrikmilk/cherri.git /tmp/cherri-upstream
          cd /tmp/cherri-upstream
          git checkout bcc0095754e2cc0baaeb4d93dae172b8153b4716
          go build -o /tmp/cherri-pure .
      - name: Compile actual Lumen Agent
        run: |
          /tmp/cherri-pure tests/lumen/Lumen_Agent_MainTextFix_20261025.cherri --skip-sign -d
          find tests/lumen -maxdepth 1 -name '*.shortcut' -ls
      - name: Boot iOS 27 and inspect Shortcuts availability
        run: |
          xcodebuild -version
          xcrun simctl list devices available
          xcrun simctl list runtimes
          command -v shortcuts || true
      - name: Attempt signed import and execution in iOS 27 simulator
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts
          xcrun simctl list devices available > artifacts/devices.txt
          SIM=$(xcrun simctl list devices available | grep -E 'iPhone.*\(.*\)' | head -1 | sed -E 's/.*\(([A-F0-9-]{36})\).*/\1/' || true)
          if [[ ! "$SIM" =~ ^[A-F0-9-]{36}$ ]]; then echo "BLOCKER=NO_SIMULATOR" | tee artifacts/result.txt; exit 1; fi
          xcrun simctl boot "$SIM" || true
          xcrun simctl bootstatus "$SIM" -b
          xcrun simctl launch "$SIM" com.apple.shortcuts > artifacts/shortcuts-launch.log 2>&1 || true
          SIGNED=tests/lumen/lumen-signed.shortcut
          test -s "$SIGNED" || { echo "BLOCKER=SIGNED_SHORTCUT_MISSING" | tee artifacts/result.txt; exit 1; }
          EXPECTED=0bf66b589144b1aca3065e5af77352289b21d6ec48ae33c3ce365294cbe4b13f
          ACTUAL=$(shasum -a 256 "$SIGNED" | cut -d' ' -f1)
          test "$ACTUAL" = "$EXPECTED" || { echo "BLOCKER=SIGNED_SHORTCUT_HASH_MISMATCH" | tee artifacts/result.txt; exit 1; }
          cp "$SIGNED" artifacts/lumen-signed.shortcut
          echo "SIGNED_SHORTCUT=VERIFIED sha256=$ACTUAL" | tee artifacts/sign.log
          cp artifacts/lumen-signed.shortcut "artifacts/Lumen Agent.shortcut"
          xcrun simctl openurl "$SIM" "file://$PWD/artifacts/Lumen Agent.shortcut" > artifacts/import.log 2>&1 || { echo "BLOCKER=IMPORT_OPENURL_FAILED" | tee artifacts/result.txt; exit 1; }
          sleep 8
          xcrun simctl io "$SIM" screenshot artifacts/import-screen.png || true
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          (
            cd tests/runtime_poc/ImportHelper
            xcodegen generate
            CHERRI_STAGE=import xcodebuild test -project ImportHelper.xcodeproj -scheme ImportHelper -destination "platform=iOS Simulator,id=$SIM" -only-testing:ImportHelperUITests/ImportHelperUITests/testInteractWithShortcuts CODE_SIGNING_ALLOWED=NO > ../../../artifacts/import-ui-test.log 2>&1
          ) || { echo "BLOCKER=IMPORT_UI_TEST_FAILED" | tee artifacts/result.txt; exit 1; }
          xcrun simctl io "$SIM" screenshot artifacts/after-add.png || true
          xcrun simctl openurl "$SIM" "shortcuts://run-shortcut?name=Lumen%20Agent" > artifacts/run.log 2>&1 || { echo "BLOCKER=RUN_OPENURL_FAILED" | tee artifacts/result.txt; exit 1; }
          sleep 12
          xcrun simctl io "$SIM" screenshot artifacts/run-screen.png || true
          echo "IMPORT_UI_TEST=COMPLETED; RUN_URL=OPENED; RESULT=UNVERIFIED_REQUIRES_RUNTIME_ASSERTION" | tee artifacts/result.txt
      - name: Upload Lumen build and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumen-ios27-validation
          path: |
            artifacts/
          if-no-files-found: warn

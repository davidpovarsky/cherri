name: BRG15 Original Negative Closure Oracle

"on": create

permissions:
  contents: read

concurrency:
  group: brg15-negative-oracle-e3fec83-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-negative-parent:
    if: >-
      github.repository == 'davidpovarsky/cherri' &&
      github.event_name == 'create' &&
      github.event.ref_type == 'branch' &&
      github.event.ref == 'probe/cherri-p10r15-brg15-negative-oracle-20261127' &&
      github.run_attempt == '1'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - name: Check out the exact controller
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: controller
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the fixed compiler source
        uses: actions/checkout@v6
        with:
          ref: e3fec8326106be7eca5db0c90bc3be56f578cd77
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Select the existing qualified Go version
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.13'
          cache-dependency-path: source/go.sum

      - name: Execute the original parent and four children
        timeout-minutes: 21
        run: /usr/bin/python3 -I -B controller/tools/ci/distinct_functions/run.py

      - name: Retain original source and test streams
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brg15-negative-oracle-e3fec83-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cherri-brg15-negative-oracle-e3fec83
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true

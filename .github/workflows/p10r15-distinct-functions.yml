name: Canonical T01 FN04 M02 Fixture Export

"on": create

permissions:
  contents: read

concurrency:
  group: native-contract-export-d00ec78-${{ github.ref }}
  cancel-in-progress: false

jobs:
  actual-canonical-exports:
    if: >-
      github.repository == 'davidpovarsky/cherri' &&
      github.event_name == 'create' &&
      github.event.ref_type == 'branch' &&
      github.event.ref == 'probe/cherri-p10r15-native-contract-export-20261127' &&
      github.run_attempt == '1'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - name: Check out the exact controller
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: controller
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the fixed compiler source
        uses: actions/checkout@v6
        with:
          ref: d00ec78d286ae771c2a30bd2e8b82a131042f5fc
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Select the existing qualified Go version
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.13'
          cache-dependency-path: source/go.sum

      - name: Execute the original canonical fixture export
        timeout-minutes: 21
        run: /usr/bin/python3 -I -B controller/tools/ci/distinct_functions/run.py

      - name: Retain original source streams and unsigned fixtures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-contract-export-d00ec78-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cherri-native-contract-export-d00ec78
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true

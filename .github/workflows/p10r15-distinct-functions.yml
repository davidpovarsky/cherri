name: Exact Current Public Binaries

"on": create

permissions:
  contents: read

concurrency:
  group: public-binaries-57cf869-${{ github.ref }}
  cancel-in-progress: false

jobs:
  actual-public-binaries:
    if: >-
      github.repository == 'davidpovarsky/cherri' &&
      github.event_name == 'create' &&
      github.event.ref_type == 'branch' &&
      github.event.ref == 'probe/cherri-p10r15-public-binaries-57cf869-20261127' &&
      github.run_attempt == '1'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - name: Check out the exact controller
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: controller
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the fixed compiler source
        uses: actions/checkout@v6
        with:
          ref: 57cf869d555f14fa79576d48b74ddcff656d3f08
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Select the existing qualified Go version
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.13'
          cache-dependency-path: source/go.sum

      - name: Build the original three public binaries
        timeout-minutes: 21
        run: /usr/bin/python3 -I -B controller/tools/ci/distinct_functions/run.py

      - name: Retain original build processes and public binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-binaries-57cf869-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cherri-public-binaries-57cf869
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true

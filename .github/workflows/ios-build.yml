name: iOS Build

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      documentation_component_only:
        description: "Type-check the isolated documentation component before app integration"
        required: false
        type: boolean
        default: false
      startup_observation_only:
        description: "Observe three original startup UI tests; publish no formal acceptance records"
        required: false
        type: boolean
        default: false
      runner_label:
        description: "Standard runner for the full iOS build (same macOS 15 Xcode/SDK scope)"
        required: true
        type: choice
        default: macos-15
        options:
          - macos-15
          - macos-15-intel

concurrency:
  group: ios-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  documentation-component:
    if: ${{ inputs.documentation_component_only == true }}
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Verify pinned documentation generator
        run: |
          mkdir -p "$RUNNER_TEMP/docs-component-evidence"
          python3 -m unittest discover -s ios/scripts -p 'test_build_documentation_index.py' -v > "$RUNNER_TEMP/docs-component-evidence/generator-tests.log" 2>&1
          python3 ios/scripts/build_documentation_index.py --docs "$RUNNER_TEMP/cherri-pinned-docs" --fetch > "$RUNNER_TEMP/docs-component-evidence/index-build.json"
      - name: Type-check standalone SwiftUI documentation component
        run: |
          xcrun swiftc -typecheck -target arm64-apple-ios17.0-simulator \
            -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            ios/CherriApp/Documentation/DocumentationIndex.swift \
            ios/CherriApp/Documentation/DocumentationSearchView.swift \
            > "$RUNNER_TEMP/docs-component-evidence/swift-typecheck.log" 2>&1
      - name: Preserve actual component diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-component-evidence
          path: ${{ runner.temp }}/docs-component-evidence
          if-no-files-found: error
          retention-days: 14

  ios-build:
    if: ${{ inputs.documentation_component_only != true }}
    runs-on: ${{ inputs.runner_label || 'macos-15' }}
    # R2 Intel run 44634890917 reached 35m after 8m12s of setup/build
    # and 26m57s in native tests. Preserve all tests and per-test bounds;
    # allow finite time for completion, evidence and the device build.
    timeout-minutes: 75

    steps:
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Checkout
        uses: actions/checkout@v6

      - name: Test bounded iOS evidence collector
        run: python3 -m unittest discover -s ios/scripts -p 'test_collect_ios_test_evidence.py' -v

      - name: Verify bounded startup observation controls
        run: |
          python3 -m unittest discover -s ios/scripts -p 'test_capture_startup_observation.py' -v
          swiftc -swift-version 5 ios/CherriApp/Diagnostics/StartupLifecycleObserver.swift \
            ios/scripts/verify_startup_lifecycle_observer.swift -o "$RUNNER_TEMP/cherri-startup-observer-controls"
          "$RUNNER_TEMP/cherri-startup-observer-controls"

      - name: Verify bounded editor startup policy
        run: |
          cat ios/CherriUITests/EditorStartupDeadline.swift ios/scripts/verify_editor_startup.swift > "$RUNNER_TEMP/cherri-editor-startup-controls.swift"
          swiftc "$RUNNER_TEMP/cherri-editor-startup-controls.swift" -o "$RUNNER_TEMP/cherri-editor-startup-controls"
          "$RUNNER_TEMP/cherri-editor-startup-controls"

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: "1.24.x"

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Bundle manifest-pinned documentation
        run: |
          python3 -m unittest discover -s ios/scripts -p 'test_build_documentation_index.py' -v
          mkdir -p ios/.build
          python3 ios/scripts/build_documentation_index.py \
            --docs "$RUNNER_TEMP/cherri-pinned-docs" --fetch \
            > ios/.build/documentation-receipt.json

      - name: Test existing Cherri compiler
        run: |
          go test -run TestCherriNoSign -v ./...
          go test -run TestDecomp -v ./...

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Build preview-shortcut bundle
        working-directory: ios/WebPreview
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Build CherriCore XCFramework
        run: bash ios/scripts/build_cherri_core.sh

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Resolve Swift packages
        working-directory: ios
        run: |
          xcodebuild -project Cherri.xcodeproj -scheme Cherri -resolvePackageDependencies \
            -clonedSourcePackagesDirPath .build/SourcePackages
          python3 scripts/prepare_editor_dependency.py --receipt .build/editor-dependency-receipt.json
          python3 -m unittest discover -s scripts -p 'test_prepare_editor_dependency.py' -v

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Build iOS Simulator app
        working-directory: ios
        run: |
          set +e
          python3 scripts/prepare_editor_dependency.py --check-only || exit $?
          xcodebuild \
            -project Cherri.xcodeproj \
            -clonedSourcePackagesDirPath .build/SourcePackages \
            -disableAutomaticPackageResolution \
            -scheme Cherri \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/simulator \
            CODE_SIGNING_ALLOWED=NO \
            build > xcodebuild-simulator.log 2>&1
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            echo "::group::Relevant Xcode errors"
            grep -nE 'error:|fatal error:|Undefined symbols|duplicate symbol|ld: |clang: error:|SwiftCompile|BUILD FAILED' xcodebuild-simulator.log | tail -n 250 || true
            echo "::endgroup::"
            echo "::group::Xcode log tail"
            tail -n 100 xcodebuild-simulator.log
            echo "::endgroup::"
            exit "$status"
          fi

          tail -n 60 xcodebuild-simulator.log

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Upload Simulator app
        uses: actions/upload-artifact@v4
        with:
          name: Cherri-Simulator-app
          path: ios/.build/simulator/Build/Products/Debug-iphonesimulator/Cherri.app
          if-no-files-found: error
          retention-days: 14

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Run CherriCore in iOS Simulator
        working-directory: ios
        env:
          STARTUP_OBSERVATION_ONLY: ${{ inputs.startup_observation_only }}
        run: |
          if [ ! -d "CherriUITests" ]; then
            echo "CRITICAL: ios/CherriUITests target missing!" >&2
            exit 1
          fi

          SIMULATOR_UDID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); devices=[d for group in data["devices"].values() for d in group if d.get("isAvailable", True) and d.get("name", "").startswith("iPhone")]; print(devices[0]["udid"] if devices else "")')"
          if [ -z "$SIMULATOR_UDID" ]; then
            echo "No available iPhone Simulator was found." >&2
            xcrun simctl list devices available
            exit 1
          fi

          printf '%s\n' "$SIMULATOR_UDID" > .build/startup-observation-udid.txt
          STARTUP_SELECTION=()
          if [ "$STARTUP_OBSERVATION_ONLY" = "true" ]; then
            STARTUP_SELECTION=(
              "-only-testing:CherriUITests/CherriEditorUITests/testBRG27EditorRealWorldWorkflowUI"
              "-only-testing:CherriUITests/CherriEditorUITests/testD03CurrentDocumentationSearchUI"
              "-only-testing:CherriUITests/CherriEditorUITests/testE01CompletionDisplayAndInsertionUI"
            )
          fi

          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool NO
          xcrun simctl boot "$SIMULATOR_UDID" >/dev/null 2>&1 || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          xcrun simctl spawn "$SIMULATOR_UDID" defaults write com.apple.Preferences KeyboardHardware -bool NO 2>/dev/null || true
          xcrun simctl spawn "$SIMULATOR_UDID" defaults write -g ConnectHardwareKeyboard -bool NO 2>/dev/null || true

          set +e
          python3 scripts/prepare_editor_dependency.py --check-only || exit $?
          xcodebuild \
            -project Cherri.xcodeproj \
            -clonedSourcePackagesDirPath .build/SourcePackages \
            -disableAutomaticPackageResolution \
            -scheme Cherri \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath .build/tests \
            CODE_SIGNING_ALLOWED=NO \
            "${STARTUP_SELECTION[@]}" \
            test > xcodetest.log 2>&1
          status=$?
          set -e

          printf '%s\n' "$status" > xcodetest.exitcode
          echo "xcodebuild test exit: $status (bounded diagnostics are collected in the next step)"
          exit "$status"

      - name: Collect bounded iOS test evidence
        id: ios_evidence
        if: always()
        working-directory: ios
        env:
          IOS_EVIDENCE_SHA: ${{ github.sha }}
          IOS_EVIDENCE_RUN_ID: ${{ github.run_id }}
          STARTUP_OBSERVATION_ONLY: ${{ inputs.startup_observation_only }}
        run: |
          DIAGNOSTIC_ARGS=()
          if [ "$STARTUP_OBSERVATION_ONLY" = "true" ]; then
            DIAGNOSTIC_ARGS=(--diagnostic-only)
          fi
          python3 scripts/collect_ios_test_evidence.py \
            xcodetest.log .build/test-evidence \
            "$IOS_EVIDENCE_SHA" "$IOS_EVIDENCE_RUN_ID" xcodetest.exitcode \
            --documentation-index CherriApp/Resources/Documentation/documentation-index.json \
            --documentation-manifest ../skills/cherri-shortcuts/compatibility-manifest.json \
            --documentation-receipt .build/documentation-receipt.json \
            "${DIAGNOSTIC_ARGS[@]}"

      - name: Capture owned startup lifecycle observations
        id: startup_observation
        if: always() && inputs.startup_observation_only == true
        working-directory: ios
        env:
          IOS_EVIDENCE_SHA: ${{ github.sha }}
          IOS_EVIDENCE_RUN_ID: ${{ github.run_id }}
        run: |
          python3 scripts/capture_startup_observation.py \
            --repo .. --log xcodetest.log --udid-file .build/startup-observation-udid.txt \
            --output .build/startup-observation-public \
            --quarantine .build/startup-observation-private \
            --source "$IOS_EVIDENCE_SHA" --run-id "$IOS_EVIDENCE_RUN_ID"

      - name: Upload bounded startup lifecycle observations
        if: always() && steps.startup_observation.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: startup-lifecycle-observation
          path: ios/.build/startup-observation-public
          if-no-files-found: error
          retention-days: 14

      - name: Upload iOS test evidence
        if: always() && steps.ios_evidence.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-evidence
          path: |
            ios/.build/test-evidence/xcodetest.log
            ios/.build/test-evidence/ios-test-evidence.json
            ios/.build/test-evidence/ios-test-diagnostics.json
            ios/.build/test-evidence/documentation-index.json
            ios/.build/test-evidence/documentation-compatibility-manifest.json
            ios/.build/test-evidence/documentation-receipt.json
          if-no-files-found: error
          retention-days: 14

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Build unsigned iPhone app
        working-directory: ios
        run: |
          set +e
          python3 scripts/prepare_editor_dependency.py --check-only || exit $?
          xcodebuild \
            -project Cherri.xcodeproj \
            -clonedSourcePackagesDirPath .build/SourcePackages \
            -disableAutomaticPackageResolution \
            -scheme Cherri \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .build/device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build > xcodebuild-device.log 2>&1
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            echo "::group::Relevant device build errors"
            grep -nE 'error:|fatal error:|Undefined symbols|duplicate symbol|ld: |clang: error:|SwiftCompile|BUILD FAILED' xcodebuild-device.log | tail -n 250 || true
            echo "::endgroup::"
            echo "::group::Device build log tail"
            tail -n 100 xcodebuild-device.log
            echo "::endgroup::"
            exit "$status"
          fi

          APP_PATH=".build/device/Build/Products/Release-iphoneos/Cherri.app"
          test -d "$APP_PATH"
          rm -rf .build/ipa
          mkdir -p .build/ipa/Payload
          cp -R "$APP_PATH" .build/ipa/Payload/Cherri.app
          (
            cd .build/ipa
            /usr/bin/zip -qry Cherri-unsigned.ipa Payload
          )
          ls -lh .build/ipa/Cherri-unsigned.ipa

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Cherri-unsigned-IPA
          path: ios/.build/ipa/Cherri-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

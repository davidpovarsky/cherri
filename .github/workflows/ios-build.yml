name: iOS Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  ios-build:
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Checkout
        uses: actions/checkout@v6

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: "1.24.x"

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Test existing Cherri compiler
        run: |
          go test -run TestCherriNoSign -v ./...
          go test -run TestDecomp -v ./...

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Build preview-shortcut bundle
        working-directory: ios/WebPreview
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Build CherriCore XCFramework
        run: bash ios/scripts/build_cherri_core.sh

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Resolve Swift packages
        working-directory: ios
        run: xcodebuild -project Cherri.xcodeproj -scheme Cherri -resolvePackageDependencies

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Build iOS Simulator app
        working-directory: ios
        run: |
          set +e
          xcodebuild \
            -project Cherri.xcodeproj \
            -scheme Cherri \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/simulator \
            CODE_SIGNING_ALLOWED=NO \
            build > xcodebuild-simulator.log 2>&1
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            echo "::group::Relevant Xcode errors"
            grep -nE 'error:|fatal error:|Undefined symbols|duplicate symbol|ld: |clang: error:|SwiftCompile|BUILD FAILED' xcodebuild-simulator.log | tail -n 250 || true
            echo "::endgroup::"
            echo "::group::Xcode log tail"
            tail -n 100 xcodebuild-simulator.log
            echo "::endgroup::"
            exit "$status"
          fi

          tail -n 60 xcodebuild-simulator.log

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Upload Simulator app
        uses: actions/upload-artifact@v4
        with:
          name: Cherri-Simulator-app
          path: ios/.build/simulator/Build/Products/Debug-iphonesimulator/Cherri.app
          if-no-files-found: error
          retention-days: 14

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Run CherriCore in iOS Simulator
        working-directory: ios
        run: |
          SIMULATOR_UDID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); devices=[d for group in data["devices"].values() for d in group if d.get("isAvailable", True) and d.get("name", "").startswith("iPhone")]; print(devices[0]["udid"] if devices else "")')"
          if [ -z "$SIMULATOR_UDID" ]; then
            echo "No available iPhone Simulator was found." >&2
            xcrun simctl list devices available
            exit 1
          fi

          xcrun simctl boot "$SIMULATOR_UDID" >/dev/null 2>&1 || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b

          set +e
          xcodebuild \
            -project Cherri.xcodeproj \
            -scheme Cherri \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath .build/tests \
            CODE_SIGNING_ALLOWED=NO \
            test > xcodetest.log 2>&1
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            echo "::group::Relevant iOS test failures"
            grep -nE 'error:|failed|XCTAssert|Test Case|TEST FAILED|Undefined symbols|ld: ' xcodetest.log | tail -n 300 || true
            echo "::endgroup::"
            echo "::group::iOS test log tail"
            tail -n 120 xcodetest.log
            echo "::endgroup::"
            exit "$status"
          fi

          grep -nE 'Test Case|TEST SUCCEEDED' xcodetest.log | tail -n 120 || tail -n 80 xcodetest.log

          python3 - xcodetest.log ios-test-evidence.json "${GITHUB_SHA:-}" "${GITHUB_RUN_ID:-}" <<'PY'
          import hashlib, json, re, sys
          from pathlib import Path

          log_path = Path(sys.argv[1])
          out_path = Path(sys.argv[2])
          impl_sha = sys.argv[3]
          run_id = sys.argv[4]
          log_bytes = log_path.read_bytes()
          log_sha = hashlib.sha256(log_bytes).hexdigest()
          log_text = log_bytes.decode("utf-8", errors="replace")

          passed_tests = set()
          for m in re.finditer(r"Test Case '-\[\w+\.(\w+)\s+(\w+)\]' passed", log_text):
              passed_tests.add(f"{m.group(1)}/{m.group(2)}")

          test_req_map = {
              "CherriCoreIntegrationTests/testE01MultiDiagnosticAnalysis": (["E01", "BRG27"], {"multi_diagnostics": "true"}),
              "CherriCoreIntegrationTests/testE02CompletionHoverSignatureDefinition": (["E02", "RP40"], {"completion_hover_sig_def": "true"}),
              "CherriCoreIntegrationTests/testE03ScopedRenameIgnoresStringsCommentsAndShadowing": (["E03"], {"scoped_rename": "true"}),
              "CherriCoreIntegrationTests/testE04FormatterPreservesCommentsAndSemantics": (["E04", "RP39"], {"formatter_idempotent_comments": "true"}),
              "CherriCoreIntegrationTests/testE05OutOfOrderVersionedEdits": (["E05"], {"versioned_edits_isolated": "true"}),
              "CherriCoreIntegrationTests/testE06UTF16DiagnosticSpansEmojiAndHebrew": (["E06"], {"utf16_spans_exact": "true"}),
              "CherriCoreIntegrationTests/testE07BoundedVisualSourceEditAndRejection": (["E07", "RP41", "BRG28"], {"visual_source_edit_bounded": "true"}),
              "CherriCoreIntegrationTests/testBRG25SharedAnalysisBridgeContract": (["BRG25"], {"shared_analysis_bridge": "true"}),
              "CherriCoreIntegrationTests/testUnicodeIdentifierCompilationAndAnalysis": (["P05"], {"unicode_identifiers": "true"}),
          }

          records = []
          for test_id, (reqs, assertions) in sorted(test_req_map.items()):
              if test_id in passed_tests:
                  safe_name = test_id.replace("/", "_")
                  records.append({
                      "evidence_id": f"ev-ios-ui-{safe_name}",
                      "requirements": reqs,
                      "tier": "ios-ui",
                      "implementation_sha": impl_sha,
                      "test_id": test_id,
                      "command": ["xcodebuild", "test", "-scheme", "Cherri"],
                      "exit_code": 0,
                      "result": "passed",
                      "assertions": assertions,
                      "artifacts": [{
                          "path": "artifacts/backend-recovery/ci-artifacts/ios-build/ios-build-evidence/xcodetest.log",
                          "sha256": log_sha,
                          "run_id": run_id,
                      }],
                      "detail": f"Executed and passed {test_id} in iOS Simulator",
                  })
                  if test_id == "CherriCoreIntegrationTests/testBRG25SharedAnalysisBridgeContract":
                      records.append({
                          "evidence_id": "ev-ios-build-BRG25",
                          "requirements": ["BRG25"],
                          "tier": "ios-build",
                          "implementation_sha": impl_sha,
                          "test_id": test_id,
                          "command": ["xcodebuild", "build-for-testing", "-scheme", "Cherri"],
                          "exit_code": 0,
                          "result": "passed",
                          "assertions": assertions,
                          "artifacts": [{
                              "path": "artifacts/backend-recovery/ci-artifacts/ios-build/ios-build-evidence/xcodetest.log",
                              "sha256": log_sha,
                              "run_id": run_id,
                          }],
                          "detail": "Built iOS Simulator app and verified shared bridge contract",
                      })

          out_path.parent.mkdir(parents=True, exist_ok=True)
          out_path.write_text(json.dumps({"records": records}, indent=2))
          print(f"Wrote {len(records)} real iOS test evidence records to {out_path}")
          PY

      - name: Upload iOS test evidence
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-evidence
          path: |
            ios/xcodetest.log
            ios/ios-test-evidence.json
          if-no-files-found: error
          retention-days: 14

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Build unsigned iPhone app
        working-directory: ios
        run: |
          set +e
          xcodebuild \
            -project Cherri.xcodeproj \
            -scheme Cherri \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .build/device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build > xcodebuild-device.log 2>&1
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            echo "::group::Relevant device build errors"
            grep -nE 'error:|fatal error:|Undefined symbols|duplicate symbol|ld: |clang: error:|SwiftCompile|BUILD FAILED' xcodebuild-device.log | tail -n 250 || true
            echo "::endgroup::"
            echo "::group::Device build log tail"
            tail -n 100 xcodebuild-device.log
            echo "::endgroup::"
            exit "$status"
          fi

          APP_PATH=".build/device/Build/Products/Release-iphoneos/Cherri.app"
          test -d "$APP_PATH"
          rm -rf .build/ipa
          mkdir -p .build/ipa/Payload
          cp -R "$APP_PATH" .build/ipa/Payload/Cherri.app
          (
            cd .build/ipa
            /usr/bin/zip -qry Cherri-unsigned.ipa Payload
          )
          ls -lh .build/ipa/Cherri-unsigned.ipa

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Cherri-unsigned-IPA
          path: ios/.build/ipa/Cherri-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

name: P10R15 Function Envelope Baseline

on:
  push:
    branches:
      - audit/cherri-p10r15-function-envelope-ci-20261122
    paths:
      - .github/workflows/p10r15-function-envelope-baseline.yml
      - tools/p10r15/run_function_envelope_baseline.py
      - tools/p10r15/function_envelope_baseline_inventory.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p10r15-function-envelope-baseline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  function-envelope-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      GIT_NO_REPLACE_OBJECTS: "1"
      CHERRI_COMPONENT_SOURCE: ${{ github.workspace }}/subject
      CHERRI_COMPONENT_OUT: ${{ github.workspace }}/cherri-function-envelope-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout exact workflow implementation
        uses: actions/checkout@v6
        with:
          path: harness
          persist-credentials: false

      - name: Checkout exact reviewed baseline source
        uses: actions/checkout@v6
        with:
          ref: 62323bcf23a45a2d18e4e6415881d0e3c79868b0
          path: subject
          fetch-depth: 0
          persist-credentials: false

      - name: Preserve declared source origin
        run: git -C "$CHERRI_COMPONENT_SOURCE" remote set-url origin https://github.com/davidpovarsky/cherri.git

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
          cache-dependency-path: subject/go.sum

      - name: Execute one fixed baseline and retain actual failure
        timeout-minutes: 5
        run: python3 -B harness/tools/p10r15/run_function_envelope_baseline.py

      - name: Retain all original outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p10r15-function-envelope-baseline-${{ github.run_id }}
          path: ${{ env.CHERRI_COMPONENT_OUT }}
          if-no-files-found: warn
          retention-days: 14

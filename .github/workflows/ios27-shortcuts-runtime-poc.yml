name: iOS 27 Shortcuts Runtime PoC

on:
  push:
    branches:
      - agent/ios27-shortcuts-runtime-poc
  workflow_dispatch:
    inputs:
      allow_public_fixture_hubsign:
        description: "Allow the existing HubSign service for only the hash-reviewed public PoC fixtures in this run"
        type: boolean
        required: true
        default: false

concurrency:
  group: ios27-poc-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  ios27-runtime-poc:
    runs-on: xcode-27
    timeout-minutes: 75

    steps:
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Verify formal PoC privacy controls
        run: python3 -m unittest discover -s tools/shortcuts-simulator-qa -p 'test_runtime_poc_*.py' -v

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Generate and build UI test helper project
        run: |
          cd tests/runtime_poc/ImportHelper
          xcodegen generate
          ls -la ImportHelper.xcodeproj
          xcodebuild build-for-testing \
            -project ImportHelper.xcodeproj \
            -scheme ImportHelper \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath .build \
            CODE_SIGN_IDENTITY="-"

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Run iOS 27 Shortcuts Runtime PoC
        env:
          CHERRI_ALLOW_EXTERNAL_SIGNING: ${{ inputs.allow_public_fixture_hubsign == true && '1' || '0' }}
        run: bash scripts/ios27_runtime_poc.sh

      - name: Live Activity · refresh
        if: always()
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Stage verified formal PoC artifacts
        id: publication
        if: always()
        run: |
          python3 tools/shortcuts-simulator-qa/runtime_poc_publication.py stage \
            --repo . --root artifacts --output poc-public

      - name: Upload PoC Artifacts
        if: always() && steps.publication.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ios27-shortcuts-runtime-poc-artifacts
          path: poc-public/
          retention-days: 7

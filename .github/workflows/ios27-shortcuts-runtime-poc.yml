name: iOS 27 Shortcuts Runtime PoC

on:
  push:
    branches:
      - agent/ios27-shortcuts-runtime-poc
  workflow_dispatch:

concurrency:
  group: ios27-poc-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  ios27-runtime-poc:
    runs-on: xcode-27
    timeout-minutes: 35

    steps:
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Generate and build UI test helper project
        run: |
          cd tests/runtime_poc/ImportHelper
          xcodegen generate
          ls -la ImportHelper.xcodeproj
          xcodebuild build-for-testing \
            -project ImportHelper.xcodeproj \
            -scheme ImportHelper \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath .build \
            CODE_SIGN_IDENTITY="-"

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Run iOS 27 Shortcuts Runtime PoC
        run: bash scripts/ios27_runtime_poc.sh

      - name: Live Activity · refresh
        if: always()
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Upload PoC Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios27-shortcuts-runtime-poc-artifacts
          path: artifacts/
          retention-days: 7

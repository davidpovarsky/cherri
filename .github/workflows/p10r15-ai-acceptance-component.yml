name: P10R15 Fixed Offline AI Acceptance Evidence

on:
  push:
    branches:
      - audit/cherri-p10r15-ai-acceptance-ci-20261122
    paths:
      - .github/workflows/p10r15-ai-acceptance-component.yml
      - tools/p10r15/run_ai_acceptance_component_ci.py
      - tools/p10r15/ai_acceptance_ci_inventory.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p10r15-ai-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fixed-offline-ai-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      GIT_NO_REPLACE_OBJECTS: "1"
      CHERRI_COMPONENT_SOURCE: ${{ github.workspace }}/subject
      CHERRI_COMPONENT_OUT: ${{ github.workspace }}/cherri-ai-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout exact workflow implementation
        uses: actions/checkout@v6
        with:
          path: harness
          persist-credentials: false

      - name: Checkout exact reviewed combined source
        uses: actions/checkout@v6
        with:
          ref: 824333e86b120e795ce44079e4cc45743e2668a9
          path: subject
          fetch-depth: 0
          persist-credentials: false

      - name: Preserve declared source origin
        run: git -C "$CHERRI_COMPONENT_SOURCE" remote set-url origin https://github.com/davidpovarsky/cherri.git

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
          cache-dependency-path: subject/go.sum

      - name: Execute fixed offline controls with bounded original intake
        timeout-minutes: 10
        run: python3 -B harness/tools/p10r15/run_ai_acceptance_component_ci.py

      - name: Retain actual originals including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p10r15-ai-acceptance-component-${{ github.run_id }}
          path: ${{ env.CHERRI_COMPONENT_OUT }}
          if-no-files-found: warn
          retention-days: 14

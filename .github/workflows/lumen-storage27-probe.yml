name: Lumen iOS 27 Storage Probe
on:
  push:
    branches: [agent/lumen-ios27-storage-20261025]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  storage-structure:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Compile with pinned pure upstream Cherri
        run: |
          git clone https://github.com/electrikmilk/cherri.git /tmp/cherri-upstream
          cd /tmp/cherri-upstream
          git checkout bcc0095754e2cc0baaeb4d93dae172b8153b4716
          go build -o /tmp/cherri-pure .
          cd "$GITHUB_WORKSPACE"
          python3 -c "from pathlib import Path; p=Path('tests/storage27/Lumen_Storage_V27_Probe.cherri'); p.write_bytes(p.read_bytes().replace(bytes([13,10]),bytes([10])))"
          /tmp/cherri-pure tests/storage27/Lumen_Storage_V27_Probe.cherri --skip-sign
      - name: Compile full Lumen Storage27 variant
        run: |
          python3 -c "from pathlib import Path; p=Path('tests/lumen/Lumen_Agent_Storage27_20261025.cherri'); p.write_bytes(p.read_bytes().replace(bytes([13,10]),bytes([10])))"
          /tmp/cherri-pure tests/lumen/Lumen_Agent_Storage27_20261025.cherri --skip-sign
      - name: Verify native storage action IDs and parameters
        run: |
          python3 - <<'PY'
          import glob,plistlib
          files=glob.glob('tests/storage27/*_unsigned.shortcut')
          assert len(files)==1,files
          actions=plistlib.load(open(files[0],'rb'))['WFWorkflowActions']
          assert len(actions)==3,len(actions)
          expected=['is.workflow.actions.setstoredcontent','is.workflow.actions.getstoredcontent']
          assert [a['WFWorkflowActionIdentifier'] for a in actions[:2]]==expected
          for a in actions[:2]:
              p=a['WFWorkflowActionParameters']
              assert p['WFStoredContentKey']=='lumen.probe.20261025'
              assert p['WFStoredContentGlobalValue'] is True
          assert actions[0]['WFWorkflowActionParameters']['WFInput']=='LUMEN_STORAGE_OK'
          full=glob.glob('tests/lumen/*Lumen Agent*_unsigned.shortcut')
          assert len(full)==1,(full,glob.glob('**/*.shortcut',recursive=True))
          main=plistlib.load(open(full[0],'rb'))['WFWorkflowActions']
          ids=[a['WFWorkflowActionIdentifier'] for a in main]
          assert ids.count('is.workflow.actions.getstoredcontent')>=20
          assert ids.count('is.workflow.actions.setstoredcontent')>=20
          assert ids.count('is.workflow.actions.deletestoredcontent')>=16
          assert 'is.workflow.actions.getfile' not in ids
          print('STORAGE_STRUCTURE_PASS; MAIN_ACTIONS=',len(main),'RUNTIME_NOT_TESTED')
          PY
      - name: Verify iOS 27 simulator exists
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep 'iOS 27'
          echo 'SIMULATOR_AVAILABLE; STORAGE_RUNTIME_NOT_TESTED'
      - name: Import and run signed storage probe on iOS 27
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/storage27
          SIM=$(xcrun simctl list devices available | grep -E 'iPhone.*\(.*\)' | head -1 | sed -E 's/.*\(([A-F0-9-]{36})\).*/\1/')
          test -n "$SIM"
          xcrun simctl boot "$SIM" || true
          xcrun simctl bootstatus "$SIM" -b
          xcrun simctl launch "$SIM" com.apple.shortcuts || true
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          cd tests/runtime_poc/ImportHelper
          xcodegen generate
          cd "$GITHUB_WORKSPACE"
          PROBE="$PWD/tests/storage27/probe-signed.shortcut"
          test -s "$PROBE"
          xcrun simctl openurl "$SIM" "file://$PROBE"
          sleep 7
          xcrun simctl io "$SIM" screenshot artifacts/storage27/import-before.png || true
          xcodebuild test -project tests/runtime_poc/ImportHelper/ImportHelper.xcodeproj -scheme ImportHelper -destination "platform=iOS Simulator,id=$SIM" -only-testing:ImportHelperUITests/ImportHelperUITests/testStorageProbeImportStrict CODE_SIGNING_ALLOWED=NO > artifacts/storage27/import-test.log 2>&1 || { tail -n 80 artifacts/storage27/import-test.log; exit 1; }
          xcrun simctl openurl "$SIM" "shortcuts://run-shortcut?name=probe-signed"
          sleep 10
          xcrun simctl io "$SIM" screenshot artifacts/storage27/run.png || true
          xcodebuild test -project tests/runtime_poc/ImportHelper/ImportHelper.xcodeproj -scheme ImportHelper -destination "platform=iOS Simulator,id=$SIM" -only-testing:ImportHelperUITests/ImportHelperUITests/testStorageProbeNoRuntimeError CODE_SIGNING_ALLOWED=NO > artifacts/storage27/runtime-test.log 2>&1 || { tail -n 80 artifacts/storage27/runtime-test.log; exit 1; }
          echo "STORAGE_SIMULATOR_NO_VISIBLE_ERROR; PERSISTENCE_NOT_PROVEN"
      - name: Sign separate storage writer and reader
        run: |
          set -euo pipefail
          for part in Writer Reader; do
            /tmp/cherri-pure "tests/storage27/Lumen_Storage_V27_${part}.cherri" --skip-sign
            unsigned=$(find tests/storage27 -maxdepth 1 -name "*${part}*_unsigned.shortcut" -print -quit)
            test -s "$unsigned"
            shortcuts sign --input "$unsigned" --output "tests/storage27/persistence-${part,,}.shortcut" --mode anyone
            test "$(head -c 4 "tests/storage27/persistence-${part,,}.shortcut")" = AEA1
          done
      - name: Prove persistent value across independent shortcut runs
        run: |
          set -euo pipefail
          SIM=$(xcrun simctl list devices available | grep -E 'iPhone.*\(.*\)' | head -1 | sed -E 's/.*\(([A-F0-9-]{36})\).*/\1/')
          for part in writer reader; do
            xcrun simctl openurl "$SIM" "file://$PWD/tests/storage27/persistence-$part.shortcut"
            sleep 7
            xcodebuild test -project tests/runtime_poc/ImportHelper/ImportHelper.xcodeproj -scheme ImportHelper -destination "platform=iOS Simulator,id=$SIM" -only-testing:ImportHelperUITests/ImportHelperUITests/testStorageProbeImportStrict CODE_SIGNING_ALLOWED=NO > "artifacts/storage27/$part-import.log" 2>&1 || { tail -n 80 "artifacts/storage27/$part-import.log"; exit 1; }
            xcrun simctl openurl "$SIM" "shortcuts://run-shortcut?name=persistence-$part"
            sleep 6
            if [ "$part" = writer ]; then test_name=testStorageWriterValue; else test_name=testStorageReaderValue; fi
            xcodebuild test -project tests/runtime_poc/ImportHelper/ImportHelper.xcodeproj -scheme ImportHelper -destination "platform=iOS Simulator,id=$SIM" "-only-testing:ImportHelperUITests/ImportHelperUITests/$test_name" CODE_SIGNING_ALLOWED=NO > "artifacts/storage27/$part-runtime.log" 2>&1 || { tail -n 80 "artifacts/storage27/$part-runtime.log"; exit 1; }
            xcrun simctl io "$SIM" screenshot "artifacts/storage27/$part-result.png"
          done
          echo "STORAGE_PERSISTENCE_PASS: independent writer and reader"
      - name: Upload storage probe screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumen-storage27-runtime
          path: artifacts/storage27/

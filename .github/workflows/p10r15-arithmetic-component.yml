name: P10R15 Fixed Arithmetic Component Evidence

on:
  push:
    branches:
      - audit/cherri-p10r15-arithmetic-ci-20261122
    paths:
      - .github/workflows/p10r15-arithmetic-component.yml
      - tools/p10r15/run_arithmetic_component_ci.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p10r15-arithmetic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fixed-arithmetic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      GIT_NO_REPLACE_OBJECTS: "1"
      CHERRI_COMPONENT_SOURCE: ${{ github.workspace }}/subject
      CHERRI_COMPONENT_OUT: ${{ github.workspace }}/cherri-arithmetic-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout exact workflow implementation
        uses: actions/checkout@v6
        with:
          path: harness
          persist-credentials: false

      - name: Checkout exact reviewed arithmetic source
        uses: actions/checkout@v6
        with:
          ref: 873c28c746b3842161672e19fe5e2381d97149f2
          path: subject
          fetch-depth: 0
          persist-credentials: false

      - name: Preserve declared source origin
        run: git -C "$CHERRI_COMPONENT_SOURCE" remote set-url origin https://github.com/davidpovarsky/cherri.git

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
          cache-dependency-path: subject/go.sum

      - name: Execute fixed arithmetic scenarios with bounded original intake
        timeout-minutes: 10
        run: python3 -B harness/tools/p10r15/run_arithmetic_component_ci.py

      - name: Retain actual originals including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p10r15-arithmetic-component-${{ github.run_id }}
          path: ${{ env.CHERRI_COMPONENT_OUT }}
          if-no-files-found: warn
          retention-days: 14
